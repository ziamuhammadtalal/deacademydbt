version: 2

models:
  - name: employee
    description: "Employee DBT model"
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['1','2','3','4','5']
                config:
                  severity: warn

      - name: emp_salary
        data_tests:
          - salary_check

  - name: customer
    description: 'Customer data Model'

  - name: customer_vw
    description: 'Customer View data Model'

  - name: sales
    description: 'DBT model for Sales table'

  - name: product
    description: 'DBT model for product'

  - name: purchase
    description: 'DBT model for purchase'

sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
  
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC
  
  - name: sales
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: sales_src

  - name: product
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: product_src

  - name: purchase
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: purchase_src